<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Milliy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#0E1B2A; --navy-2:#152436; --navy-3:#1D3048;
  --gold:#C9A227; --gold-soft:#E0C36A; --gold-dim:rgba(201,162,39,.28);
  --cream:#F2E8D5; --cream-2:#A9A08E;
  --line:rgba(201,162,39,.20);
  --r:14px;
  /* высоту липкой полосы вкладок меряет JS: под ней приклеивается лента разделов меню */
  --tabsH:47px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--navy); color:var(--cream)}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif; font-size:16px; line-height:1.5;
  /* запас снизу — только под кнопку Telegram и вырез экрана, не 120px вслепую */
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
  /* Колонка на всю высоту окна: иначе короткий шаг оставлял под собой
     провал до кнопки Telegram, и подвал зависал посередине экрана. */
  display:flex; flex-direction:column; min-height:100vh;
  background-image:
    radial-gradient(1100px 380px at 50% -160px, rgba(201,162,39,.10), transparent 70%),
    linear-gradient(180deg, #0E1B2A 0%, #0B1522 100%);
  background-attachment:fixed;
}
.wrap{padding:0 18px; flex:0 0 auto}
@supports (height:100dvh){ body{min-height:100dvh} }

/* шапка */
/* Шапка забирает себе весь свободный остаток окна. На коротком шаге
   (три кнопки «когда придёте») это фотография во весь экран вместо провала,
   на длинном — ужимается до минимума и уступает место содержимому. */
.hero{position:relative; margin:0 0 6px; flex:1 1 auto;
  min-height:104px; max-height:60vh; overflow:hidden}
/* На сетах, меню и залах содержимое длинное, и растянутая шапка только
   отодвигала бы его вниз: там она сжата до узкой полосы с названием. */
body:not(.tab-book) .hero{flex:0 0 auto; min-height:96px; max-height:96px}
/* Абсолютом, а не height:100%: шапка тянется флексом, заданной высоты у неё
   нет, и процент от «авто» браузер считать отказывается — картинка вставала
   в натуральный размер, а остаток шапки оставался пустой заливкой. */
.hero img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  display:block; opacity:.92}
/* Затемняем только низ — ровно настолько, чтобы читался заголовок.
   Сплошная вуаль поверх всего кадра превращала фотографию в тёмное пятно. */
.hero::after{content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(14,27,42,.10) 0%, rgba(14,27,42,.18) 42%,
    rgba(14,27,42,.78) 82%, #0E1B2A 100%)}
body:not(.tab-book) .hero::after{
  background:linear-gradient(180deg, rgba(14,27,42,.34) 0%, rgba(14,27,42,.74) 58%, #0E1B2A 100%)}
.hero .cap{position:absolute; left:18px; right:18px; bottom:14px; z-index:2}
body:not(.tab-book) .hero .cap{bottom:10px}
.brand{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold-soft); margin-bottom:5px}
h1{font-family:"Playfair Display",Georgia,serif; font-size:clamp(21px, 6.2vw, 29px); line-height:1.1; margin:0; font-weight:700}
.sub{color:var(--cream-2); font-size:14.5px; margin-top:6px}

/* переключатель языка */
.langbar{position:absolute; top:12px; right:14px; z-index:3; display:flex; gap:6px}
.langbar button{
  border:1px solid var(--line); background:rgba(14,27,42,.72); color:var(--cream-2);
  border-radius:99px; padding:5px 11px; font-size:12px; font-family:inherit;
  letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
}
.langbar button.on{border-color:var(--gold); color:var(--gold-soft)}

/* вкладки: бронь, сеты, меню, залы. Липнут к верху, поэтому уйти с меню
   обратно в бронь можно с любой точки прокрутки. */
.tabs{
  position:sticky; top:0; z-index:7; display:flex; gap:5px; padding:7px 18px 6px;
  background:rgba(11,21,34,.93); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:1 1 auto; white-space:nowrap; border:1px solid transparent; background:transparent;
  color:var(--cream-2); font-family:inherit; font-size:14px; padding:7px 10px;
  border-radius:99px; cursor:pointer; transition:color .15s, background .15s, border-color .15s;
}
.tabs button.on{background:var(--navy-3); border-color:var(--gold-dim); color:var(--gold-soft); font-weight:600}

/* секции */
section{margin-top:22px}
.page[hidden], .tabpage[hidden]{display:none}

/* индикатор шага */
.progress{height:2px; background:var(--line); border-radius:2px; margin:14px 0 9px; overflow:hidden}
.progress i{display:block; height:100%; width:0; background:var(--gold);
  transition:width .22s ease}
.stepline{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--gold-soft)}
.label{
  display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--gold-soft); margin-bottom:11px;
}
.label::after{content:""; flex:1; height:1px; background:var(--line)}
.row{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--line); background:var(--navy-2); color:var(--cream);
  padding:11px 16px; border-radius:99px; font-size:15px; font-family:inherit; cursor:pointer;
  transition:transform .08s ease, background .15s, border-color .15s, color .15s;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--gold); border-color:var(--gold); color:#101A26; font-weight:600}
.chip.wide{flex:1; min-width:98px; text-align:center}

/* залы */
.halls{display:grid; gap:10px}
.hall{
  position:relative; display:flex; gap:13px; align-items:center; padding:9px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--navy-2); cursor:pointer;
  transition:border-color .15s, background .15s;
}
.hall.on{border-color:var(--gold); background:var(--navy-3)}
.hall.on::before{content:"✓"; position:absolute; top:9px; right:12px; color:var(--gold); font-size:14px}
.hall img{width:92px; height:68px; object-fit:cover; border-radius:10px; flex-shrink:0; background:var(--navy-3)}
.hall .nophoto{width:92px; height:68px; border-radius:10px; flex-shrink:0;
  border:1px dashed var(--line); background:rgba(201,162,39,.05)}
.hall b{display:block; font-size:15.5px; font-weight:600; font-family:"Playfair Display",Georgia,serif}
.hall span{font-size:13px; color:var(--cream-2)}

/* витрина сетов — стоит перед формой брони, палитра и радиусы те же,
   что у карточек залов. Лента едет по горизонтали: семь карточек в столбик
   увели бы выбор дня на второй экран. Полные карточки с составом живут
   на вкладке «Сеты», данные у обеих витрин одни (массив SETS). */
.setrow{
  display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
  /* лента выходит под края экрана, чтобы обрезанная карточка подсказывала прокрутку */
  margin:0 -18px; padding:2px 18px 5px; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.setrow::-webkit-scrollbar{display:none}
.setcard{
  flex:0 0 172px; scroll-snap-align:start; display:flex; flex-direction:column;
  border:1px solid var(--line); border-radius:var(--r); background:var(--navy-2); overflow:hidden;
  cursor:pointer; text-align:left; font-family:inherit; color:inherit; padding:0;
}
.setcard img{width:100%; height:100px; object-fit:cover; display:block; background:var(--navy-3)}
/* Кадра к сету пока нет — вместо пустой дырки мягкая заливка в той же палитре */
.setcard .nophoto{height:100px; border-bottom:1px solid var(--line);
  background:radial-gradient(120px 60px at 50% 120%, rgba(201,162,39,.16), transparent 70%), var(--navy-3)}
.setcard .in{padding:9px 12px 11px; display:flex; flex-direction:column; gap:3px; flex:1}
.setcard .when{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--cream-2)}
.setcard b{font-family:"Playfair Display",Georgia,serif; font-size:15px; font-weight:600; line-height:1.2}
.setcard .gift{font-size:12px; color:var(--cream-2); line-height:1.3}
.setcard .price{margin-top:auto; padding-top:6px; color:var(--gold-soft);
  font-size:14.5px; font-weight:600}
/* последняя плитка ленты уводит на полную витрину */
.setmore{
  flex:0 0 112px; scroll-snap-align:start; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:12px; border:1px dashed var(--line); border-radius:var(--r);
  background:transparent; color:var(--gold-soft); font-family:inherit; font-size:13.5px; cursor:pointer;
}

/* поля */
input[type=text], input[type=date], input[type=search]{
  width:100%; padding:13px 15px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--navy-2); color:var(--cream); font-size:16px; font-family:inherit;
}
input::placeholder{color:#6E7B8C}
input:focus{outline:none; border-color:var(--gold)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none; height:16px; width:16px;
  background:var(--cream-2); cursor:pointer;
  -webkit-mask:radial-gradient(circle,#000 42%,transparent 44%) no-repeat center/100% 100%}
.phone-btn{
  width:100%; padding:15px; border:1px solid var(--gold); border-radius:var(--r);
  background:transparent; color:var(--gold-soft); font-size:15.5px; font-weight:500;
  font-family:inherit; cursor:pointer;
}
.phone-btn:active{background:var(--navy-3)}
.got{
  background:var(--navy-2); border:1px solid var(--gold); color:var(--gold-soft);
  text-align:center; padding:14px; border-radius:var(--r); font-size:15.5px;
}
.hint{font-size:12.5px; color:var(--cream-2); margin-top:8px}
.hint.tap{color:var(--gold-soft); cursor:pointer; text-decoration:underline; text-underline-offset:3px}

/* ── вкладка «Сеты»: полная карточка с составом ───────── */
.setfull{display:grid; gap:14px; margin-top:16px}
.setbig{border:1px solid var(--line); border-radius:var(--r); background:var(--navy-2); overflow:hidden}
.setbig>img{width:100%; height:168px; object-fit:cover; display:block; background:var(--navy-3)}
.setbig .nophoto{height:96px; border-bottom:1px solid var(--line);
  background:radial-gradient(180px 90px at 50% 120%, rgba(201,162,39,.16), transparent 70%), var(--navy-3)}
.setbig .in{padding:13px 15px 15px}
.setbig .when{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--gold-soft)}
.setbig h3{font-family:"Playfair Display",Georgia,serif; font-size:19px; font-weight:600;
  margin:5px 0 0; line-height:1.15}
.setbig .who{font-size:12.5px; color:var(--cream-2); margin-top:3px}
.setbig .made{font-size:14px; color:var(--cream); margin-top:9px; line-height:1.45}
.setbig .gift{font-size:13.5px; color:var(--gold-soft); margin-top:7px; line-height:1.4}
.setbig .pr{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:11px}
.setbig .pr b{font-size:18px; color:var(--gold-soft); font-family:"Playfair Display",Georgia,serif}
.setbig .pr span{font-size:12.5px; color:var(--cream-2)}
.ghost{
  margin-top:12px; width:100%; padding:12px; border:1px solid var(--gold-dim); border-radius:12px;
  background:transparent; color:var(--gold-soft); font-family:inherit; font-size:14.5px; cursor:pointer;
}
.ghost:active{background:var(--navy-3)}

/* ── вкладка «Меню» ───────────────────────────────────── */
.msearch{margin-top:16px}
/* Лента разделов липнет прямо под вкладками: на 139 позициях это
   единственный способ попасть в нужный раздел без долгой прокрутки. */
.rail{
  position:sticky; top:var(--tabsH); z-index:6; display:flex; gap:7px; overflow-x:auto;
  margin:12px -18px 0; padding:9px 18px; scrollbar-width:none;
  background:rgba(11,21,34,.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.rail::-webkit-scrollbar{display:none}
.rail button{
  white-space:nowrap; border:1px solid var(--line); background:var(--navy-2); color:var(--cream-2);
  font-family:inherit; font-size:13px; padding:6px 13px; border-radius:99px; cursor:pointer;
}
.rail button.on{background:var(--gold); border-color:var(--gold); color:#101A26; font-weight:600}
.msec{padding-top:6px}
.mtitle{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  margin:20px 0 4px; padding-top:6px;
}
.mtitle b{font-family:"Playfair Display",Georgia,serif; font-size:19px; font-weight:600}
.mtitle .mtime{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--cream-2)}
.mgh{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-soft);
  margin:14px 0 2px}
.dish{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid rgba(201,162,39,.10)}
.dish img, .dish .ph{
  width:56px; height:56px; border-radius:10px; flex:0 0 56px; object-fit:cover;
  background:var(--navy-3);
}
.dish .ph{border:1px solid var(--line);
  background:radial-gradient(28px 28px at 50% 120%, rgba(201,162,39,.18), transparent 70%), var(--navy-3)}
.dish .t{flex:1 1 auto; min-width:0}
.dish .hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.dish .n{font-size:15px; font-weight:500; line-height:1.25}
.dish .n i{font-style:normal; color:var(--gold); font-size:12px; margin-left:5px}
.dish .p{white-space:nowrap; color:var(--gold-soft); font-size:14.5px; font-weight:600}
.dish .d{font-size:12.5px; color:var(--cream-2); line-height:1.35; margin-top:3px}
.dish .nt{font-size:11.5px; color:var(--gold-soft); opacity:.8; margin-top:3px}
.mempty{text-align:center; color:var(--cream-2); padding:34px 0; font-size:14.5px}

/* ── вкладка «Залы» ───────────────────────────────────── */
.zone{border:1px solid var(--line); border-radius:var(--r); background:var(--navy-2);
  overflow:hidden; margin-top:14px}
.shots{display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:8px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.shots::-webkit-scrollbar{display:none}
.shots img{flex:0 0 76%; height:168px; object-fit:cover; border-radius:10px;
  scroll-snap-align:center; background:var(--navy-3)}
.zone .in{padding:4px 15px 15px}
.zone h3{font-family:"Playfair Display",Georgia,serif; font-size:19px; font-weight:600; margin:6px 0 0}
.zone p{font-size:14px; color:var(--cream-2); margin:6px 0 0; line-height:1.45}

/* итог */
.summary{
  margin-top:26px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--navy-2); overflow:hidden;
}
.summary .head{
  padding:11px 16px; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--gold-soft);
}
.summary .body{padding:6px 16px 13px}
.summary div.line{display:flex; justify-content:space-between; gap:14px; padding:7px 0; font-size:15px}
.summary .line span:first-child{color:var(--cream-2)}
.summary .line span:last-child{text-align:right}
.note{
  border:1px solid var(--line); border-left:2px solid var(--gold); border-radius:10px;
  padding:11px 14px; font-size:14px; color:var(--cream-2); margin-top:11px; background:var(--navy-2);
}
footer{text-align:center; color:var(--cream-2); font-size:12.5px; margin:24px 0 4px}

/* Узкие телефоны (360 px и уже): ужимаем то, что первым упирается в край. */
@media (max-width:374px){
  .wrap{padding:0 14px}
  .setrow, .rail{margin-left:-14px; margin-right:-14px; padding-left:14px; padding-right:14px}
  .tabs{padding-left:14px; padding-right:14px; gap:4px}
  .tabs button{font-size:13px; padding:7px 8px}
  .chip{padding:10px 13px; font-size:14.5px}
  .dish img, .dish .ph{width:50px; height:50px; flex-basis:50px}
  .dish .n{font-size:14.5px}
  .hero .cap{left:14px; right:14px}
}
</style>
</head>
<body class="tab-book">

<div class="hero">
  <img src="../img/terrasa-12-zal-vecherom.jpg" alt="">
  <div class="langbar" id="langbar"></div>
  <div class="cap">
    <div class="brand">Retro Milliy</div>
    <h1 id="h1"></h1>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>

<div class="wrap">

<!-- ── бронь ─────────────────────────────────────────── -->
<div class="tabpage" data-tab="book">
  <div class="progress"><i id="bar"></i></div>
  <div class="stepline" id="stepline"></div>
  <div class="sub" id="sub"></div>

  <div class="page" data-step="1">
    <section id="setsSection">
      <div class="label"><span id="lSets"></span></div>
      <div class="hint" id="setsLead" style="margin-top:0; margin-bottom:10px"></div>
      <div class="setrow" id="sets"></div>
      <div class="hint" id="setsFoot"></div>
    </section>
    <section>
      <div class="label"><span id="l1"></span></div>
      <div class="row" id="days"></div>
      <div style="margin-top:9px; display:none" id="dateWrap"><input type="date" id="dateInput"></div>
    </section>
    <section id="timeSection" hidden>
      <div class="label"><span id="l2"></span></div>
      <div class="row" id="parts"></div>
      <div class="row" id="slots" style="margin-top:9px"></div>
      <div class="note" id="closedNote" style="display:none"></div>
    </section>
  </div>

  <div class="page" data-step="2" hidden>
    <section>
      <div class="label"><span id="l3"></span></div>
      <div class="row" id="guests"></div>
    </section>
  </div>

  <div class="page" data-step="3" hidden>
    <section>
      <div class="label"><span id="l4"></span></div>
      <div class="halls" id="halls"></div>
    </section>
  </div>

  <div class="page" data-step="4" hidden>
    <section>
      <div class="label"><span id="l5"></span></div>
      <input type="text" id="name" autocomplete="given-name">
    </section>
    <section id="phoneSection">
      <div class="label"><span id="l6"></span></div>
      <div id="phoneBox"></div>
      <div class="hint" id="phoneHint"></div>
    </section>
    <div class="summary" id="summary">
      <div class="head" id="sumHead"></div>
      <div class="body" id="summaryBody"></div>
    </div>
  </div>
</div>

<!-- ── сеты ──────────────────────────────────────────── -->
<div class="tabpage" data-tab="sets" hidden>
  <div class="sub" id="setsPageLead"></div>
  <div class="setfull" id="setsFull"></div>
  <div class="note" id="setsPageFoot"></div>
</div>

<!-- ── меню ──────────────────────────────────────────── -->
<div class="tabpage" data-tab="menu" hidden>
  <div class="sub" id="menuLead"></div>
  <div class="msearch"><input type="search" id="mSearch" autocomplete="off" enterkeyhint="search"></div>
  <div class="rail" id="rail"></div>
  <div id="menuList"></div>
  <div class="mempty" id="mEmpty" hidden></div>
</div>

<!-- ── залы ──────────────────────────────────────────── -->
<div class="tabpage" data-tab="halls" hidden>
  <div class="sub" id="hallsLead"></div>
  <div id="zones"></div>
</div>

<footer id="foot"></footer>
</div>

<script>
const tg = window.Telegram?.WebApp;
const P = new URLSearchParams(location.search);
const closed = (P.get('closed') || '').split(',').filter(Boolean);
const API = (P.get('api') || '').replace(/\/+$/,'');
// Пути относительные: мини-апп и все кадры лежат в одном репозитории (retro-photos),
// с чужого домена картинки всё равно брать нельзя. Заодно всё открывается локально.

// В состоянии живут только канонические ключи. Подписи считаются от текущего
// языка при каждой отрисовке — иначе после переключения языка в итоге
// оставались слова на прежнем.
const s = { day:null, date:null, part:null, time:null, guests:null,
            hall:null, name:'', phone:'' };

const dayLabel = () => {
  if(!s.day) return null;
  if(s.day==='other') return s.date || null;
  return L.days[DAY_KEYS.indexOf(s.day)];
};
const hallLabel = () => {
  const i = HALL_KEYS.indexOf(s.hall);
  return i < 0 ? null : L.halls[i][0];
};

const el=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};

// ── отложенная загрузка кадров ──────────────────────────
// Одного loading="lazy" мало: у картинок внутри спрятанной вкладки браузер
// не может посчитать видимость и тянет их сразу — на старте уходило 110 файлов
// и 2,6 МБ. Адрес подставляем сами, когда кадр подъезжает к экрану.
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((list)=>{
  list.forEach(e=>{
    if(!e.isIntersecting) return;
    const t=e.target;
    if(t.dataset.src){ t.src=t.dataset.src; t.removeAttribute('data-src'); }
    io.unobserve(t);
  });
}, {rootMargin:'400px'}) : null;
function lazyImg(url, alt){
  const i=el('img'); i.alt=alt||''; i.loading='lazy'; i.decoding='async';
  if(io){ i.dataset.src=url; io.observe(i); } else i.src=url;
  return i;
}
const pick=(box,on)=>{[...box.children].forEach(c=>c.classList.remove('on')); on.classList.add('on');};
const buzz=()=>{ try{ tg?.HapticFeedback?.selectionChanged(); }catch(e){} };
const $=(id)=>document.getElementById(id);

// ── вкладки ─────────────────────────────────────────────
// Бронь — вкладка по умолчанию, то есть ноль тапов от входа. С любой другой
// вкладки в бронь ведут два пути: полоса вкладок сверху (она липкая) и главная
// кнопка Telegram внизу, которая там подписана «Забронировать стол».
const TABS = ['book','sets','menu','halls'];
let tab = 'book';

function renderTabs(){
  const box=$('tabs'); box.innerHTML='';
  TABS.forEach((k,i)=>{
    const b=el('button',k===tab?'on':null,L.tabs[i]);
    b.onclick=()=>{ if(k!==tab){ buzz(); goTab(k); } };
    box.appendChild(b);
  });
  measureTabs();
}
function measureTabs(){
  const h=$('tabs').offsetHeight;
  if(h) document.documentElement.style.setProperty('--tabsH', h+'px');
}
function goTab(k, keepScroll){
  tab=k;
  document.body.className='tab-'+k;
  document.querySelectorAll('.tabpage').forEach(p=>{ p.hidden = p.dataset.tab!==k; });
  renderTabs();
  $('h1').textContent = L.titles[TABS.indexOf(k)];
  if(!keepScroll) window.scrollTo(0,0);
  if(tg){ (k!=='book' || step>1) ? tg.BackButton.show() : tg.BackButton.hide(); }

}

// ── время ───────────────────────────────────────────────
// reset=true — гость сменил день, прежнее время больше не годится.
// reset=false — просто перерисовка (например, после смены языка): выбор сохраняем.
function renderParts(reset){
  const parts=$('parts'), slots=$('slots'), note=$('closedNote');
  // Блок времени появляется только после выбора дня: пустой заголовок
  // без единой кнопки под ним читался как сломанный экран.
  $('timeSection').hidden = !s.day;
  parts.innerHTML=''; slots.innerHTML=''; note.style.display='none';
  if(reset){ s.part=null; s.time=null; }
  const blocked=[];
  PART_KEYS.forEach((k,i)=>{
    const shut=(s.day==='today'&&closed.includes('today_'+k))||(s.day==='tomorrow'&&closed.includes('tomorrow_'+k));
    if(shut){ blocked.push(L.parts[i].replace(/^\S+\s/,'').toLowerCase()); return; }
    const b=el('button','chip',L.parts[i]);
    if(s.part===k) b.classList.add('on');
    b.onclick=()=>{ buzz(); pick(parts,b); s.part=k; s.time=null; renderSlots(PART_TIMES[i]); update(); };
    parts.appendChild(b);
  });
  if(s.part){ const i=PART_KEYS.indexOf(s.part); if(i>=0) renderSlots(PART_TIMES[i]); }
  if(blocked.length){ note.textContent=L.closedNote+blocked.join(', ')+L.closedTail; note.style.display='block'; }
}
function renderSlots(times){
  const slots=$('slots'); slots.innerHTML='';
  times.forEach(t=>{ const b=el('button','chip',t);
    if(s.time===t) b.classList.add('on');
    b.onclick=()=>{ buzz(); pick(slots,b); s.time=t; update(); }; slots.appendChild(b); });
}

// ── меню ────────────────────────────────────────────────
// 139 позиций одним списком не вываливаем: сверху липкая лента разделов
// (перескок к якорю) и поиск по названию и составу.
let mQuery='';
const norm=(x)=>x.toLowerCase().replace(/ё/g,'е');

function renderMenu(){
  const list=$('menuList'); list.innerHTML='';
  const rail=$('rail'); rail.innerHTML='';
  MENU.forEach(sec=>{
    const chip=el('button',null,L.secs[sec.id]||sec.id);
    chip.dataset.for=sec.id;
    chip.onclick=()=>{ buzz(); jumpTo(sec.id); };
    rail.appendChild(chip);

    const box=el('div','msec'); box.id='sec-'+sec.id; box.dataset.sec=sec.id;
    const title=el('div','mtitle');
    title.appendChild(el('b',null,L.secs[sec.id]||sec.id));
    if(sec.time) title.appendChild(el('span','mtime',L.mTime.replace('{t}',sec.time)));
    box.appendChild(title);
    sec.g.forEach(gr=>{
      const g=el('div','mgrp');
      if(gr.id) g.appendChild(el('div','mgh',L.grps[gr.id]||gr.id));
      gr.d.forEach(d=>g.appendChild(dishRow(d)));
      box.appendChild(g);
    });
    list.appendChild(box);
  });
  applySearch();

// d = [название, цена, вторая цена, примечание, состав, файл фото, хит]
function dishRow(d){
  const row=el('div','dish');
  row.dataset.q=norm(d[0]+' '+d[4]);
  if(d[5]){
    const img=lazyImg(DISH+d[5]+'.jpg', d[0]); img.width=56; img.height=56;
    row.appendChild(img);
  } else row.appendChild(el('div','ph'));
  const t=el('div','t');
  const hd=el('div','hd');
  const n=el('span','n',d[0]);
  if(d[6]) n.appendChild(el('i',null,'♥'));
  hd.appendChild(n);
  hd.appendChild(el('span','p', d[2] ? fmtNum(d[1])+' / '+fmtNum(d[2]) : fmtNum(d[1])));
  t.appendChild(hd);
  if(d[4]) t.appendChild(el('div','d',d[4]));
  if(d[3]) t.appendChild(el('div','nt',d[3]));
  row.appendChild(t);
  return row;
}

function applySearch(){
  const q=norm(mQuery.trim());
  $('rail').hidden = !!q;
  let found=0;
  document.querySelectorAll('#menuList .msec').forEach(sec=>{
    let vis=0;
    sec.querySelectorAll('.mgrp').forEach(g=>{
      let gv=0;
      g.querySelectorAll('.dish').forEach(r=>{
        const ok = !q || r.dataset.q.includes(q);
        r.hidden=!ok; if(ok) gv++;
      });
      g.hidden = gv===0; vis+=gv;
    });
    sec.hidden = vis===0; found+=vis;
  });
  $('mEmpty').hidden = found>0;
  if(!q) syncRail();
}
$('mSearch').oninput=e=>{ mQuery=e.target.value; applySearch(); };

const stickyH=()=>$('tabs').offsetHeight + ($('rail').hidden?0:$('rail').offsetHeight);
// Своя анимация вместо scroll-behavior:smooth: в вебвью Telegram на старых
// телефонах плавная прокрутка просто не срабатывает, и перескок по разделу
// молча не работал. Здесь он работает везде.
let slide=0, slideEnd=0;
function glideTo(y){
  cancelAnimationFrame(slide); clearTimeout(slideEnd);
  const from=window.scrollY;
  const to=Math.max(0, Math.min(y, document.documentElement.scrollHeight-window.innerHeight));
  const dist=to-from;
  if(Math.abs(dist)<2 || document.hidden){ window.scrollTo(0,to); return; }
  const t0=performance.now(), ms=Math.min(420, 160+Math.abs(dist)/6);
  const tick=(now)=>{
    const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    window.scrollTo(0, from+dist*e);
    if(k<1) slide=requestAnimationFrame(tick);
  };
  slide=requestAnimationFrame(tick);
  // Страховка: если кадры не идут (свёрнутое окно, экономия батареи),
  // раздел всё равно оказывается там, где его ждут.
  slideEnd=setTimeout(()=>{ cancelAnimationFrame(slide); window.scrollTo(0,to); }, ms+140);
}
function jumpTo(id){
  const t=$('sec-'+id); if(!t) return;
  glideTo(t.getBoundingClientRect().top + window.scrollY - stickyH() - 4);
}
let railTick=false;
function syncRail(){
  if(tab!=='menu') return;
  const rail=$('rail'); if(rail.hidden) return;
  const edge=stickyH()+14;
  let cur=null;
  document.querySelectorAll('#menuList .msec').forEach(sec=>{
    if(!sec.hidden && sec.getBoundingClientRect().top<=edge) cur=sec.dataset.sec;
  });
  if(!cur && rail.children.length) cur=rail.children[0].dataset.for;
  [...rail.children].forEach(c=>{
    const on=c.dataset.for===cur;
    if(on && !c.classList.contains('on')) rail.scrollLeft=Math.max(c.offsetLeft-70,0);
    c.classList.toggle('on', on);
  });
}
window.addEventListener('scroll',()=>{
  if(railTick) return; railTick=true;
  requestAnimationFrame(()=>{ railTick=false; syncRail(); });
}, {passive:true});
window.addEventListener('resize', ()=>{ measureTabs(); syncRail(); });

// ── имя ─────────────────────────────────────────────────
const nameInput=$('name');
const who=tg?.initDataUnsafe?.user;
nameInput.value = PRENAME || (who?.first_name ? [who.first_name,who.last_name].filter(Boolean).join(' ') : '');
s.name=nameInput.value.trim();
nameInput.oninput=e=>{ s.name=e.target.value.trim(); update(); };

// ── телефон ─────────────────────────────────────────────
// Своего гостя не переспрашиваем: раздел просто не показывается,
// телефон подставит бот из профиля.
function renderPhone(){
  const box=$('phoneBox');
  if(KNOWN){ $('phoneSection').style.display='none'; return; }
  box.innerHTML='';
  if(s.phone){ box.appendChild(el('div','got',L.phoneGot+s.phone)); return; }
  const b=el('button','phone-btn',L.phoneBtn);
  b.onclick=()=>{
    if(!tg?.requestContact){ manual(); return; }
    tg.requestContact((ok,res)=>{
      if(ok){ const raw=res?.responseUnsafe?.contact?.phone_number||res?.contact?.phone_number;
        if(raw){ s.phone=String(raw).startsWith('+')?raw:'+'+raw; renderPhone(); update(); }
        else manual(); }
      else manual();
    });
  };
  box.appendChild(b);
  const m=el('div','hint tap',L.phoneManual);
  m.onclick=manual; box.appendChild(m);
}
function manual(){
  const box=$('phoneBox'); box.innerHTML='';
  const i=el('input'); i.type='text'; i.placeholder='+998 XX XXX XX XX'; i.inputMode='tel';
  i.oninput=e=>{ s.phone=e.target.value.trim(); update(); };
  box.appendChild(i); i.focus();
}

// ── итог и главная кнопка ───────────────────────────────
// ── шаги ────────────────────────────────────────────────
// Бронь разбита на четыре экрана: на одном полотне шесть блоков не помещались
// и уезжали за край на невысоких телефонах.
const STEPS=4;
let step=1;
const stepReady=(n)=>
  n===1 ? !!(s.day && (s.day!=='other'||s.date) && s.time) :
  n===2 ? !!s.guests :
  n===3 ? !!s.hall :
          !!(s.name && (KNOWN || s.phone.replace(/\D/g,'').length>=9));
const ready=()=>[1,2,3,4].every(stepReady);

function showStep(n){
  step=Math.min(Math.max(n,1),STEPS);
  document.querySelectorAll('.page').forEach(p=>{ p.hidden = +p.dataset.step!==step; });
  $('bar').style.width = Math.round(step/STEPS*100)+'%';
  $('sub').hidden = step>1; // вводная фраза нужна один раз, на входе
  $('stepline').textContent=(L.stepOf||'{n}/{m}').replace('{n}',step).replace('{m}',STEPS);
  if(tg){ (step>1 || tab!=='book') ? tg.BackButton.show() : tg.BackButton.hide(); }
  window.scrollTo(0,0);
  update();
}

function update(){
  if(window.__sent) return;
  const dl=dayLabel();
  const rows=[[L.kWhen, dl&&s.time?dl+', '+s.time:''],
    [L.kGuests, s.guests||''], [L.kHall, hallLabel()||''],
    [L.kName, s.name||'']];
  if(!KNOWN) rows.push([L.kPhone, s.phone||'']);
  const body=$('summaryBody'); body.innerHTML='';
  rows.filter(([,v])=>v).forEach(([k,v])=>{ const d=el('div','line');
    d.appendChild(el('span',null,k)); d.appendChild(el('span',null,v)); body.appendChild(d); });
  const btn=tg?.MainButton; if(!btn) return;
  btn.setParams({ color:'#C9A227', text_color:'#101A26' });
  // На сетах, меню и залах главная кнопка ведёт в бронь: оттуда она в один тап.
  if(tab!=='book'){ btn.setText(L.bookCta); btn.show(); btn.enable(); return; }
  const last = step===STEPS;
  btn.setText(last ? L.send : (L.next||'→'));
  btn.show();
  stepReady(step) ? btn.enable() : btn.disable();
}

function renderAll(){
  if(io) io.disconnect();   // прежние кадры выброшены, наблюдать за ними нечего
  renderLangbar(); renderChrome(); renderTabs();
  renderSets(); renderSetsPage(); renderMenu(); renderZones();
  renderDays(); renderGuests(); renderHalls();
  renderParts(false);
  renderPhone(); showStep(step);
  measureTabs();
}

if(tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#0E1B2A'); tg.setBackgroundColor('#0E1B2A'); }catch(e){}
  tg.BackButton.onClick(()=>{
    if(tab!=='book'){ goTab('book'); return; }
    if(step>1) showStep(step-1);
  });
  let sent=false;                       // заявка уходит один раз, сколько бы ни нажали
  tg.MainButton.onClick(()=>{
    if(tab!=='book'){ goTab('book'); return; }
    if(step<STEPS){ if(stepReady(step)) showStep(step+1); return; }
    if(sent || !ready()) return;
    sent=true; window.__sent=true;
    tg.MainButton.disable();
    tg.MainButton.setText(L.sending);
    try{ tg.MainButton.showProgress(true); }catch(e){}
    try{ tg.HapticFeedback?.notificationOccurred('success'); }catch(e){}

    const booking={ t:'table', lang, day:s.day, date:s.date, dayLabel:dayLabel(),
      part:s.part, time:s.time, guests:s.guests, hall:s.hall, hallLabel:hallLabel(),
      name:s.name, phone:KNOWN?'':s.phone };

    // sendData умеет только приложение, открытое кнопкой клавиатуры. Если у нас
    // есть адрес бота и подпись Telegram — шлём напрямую, и тогда бронь работает
    // из любой точки входа: кнопки меню, ссылки, сообщения с фото.
    if(API && tg.initData){
      fetch(API+'/booking',{ method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({ initData:tg.initData, booking }) })
        .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(()=>{ try{ tg.HapticFeedback?.notificationOccurred('success'); }catch(e){} tg.close(); })
        .catch(()=>{
          // не достучались — пробуем старым путём, а если и он недоступен,
          // возвращаем кнопку, чтобы гость не остался с мёртвым экраном
          try{ tg.sendData(JSON.stringify(booking)); }
          catch(e){
            sent=false; window.__sent=false;
            try{ tg.MainButton.hideProgress(); }catch(e2){}
            tg.MainButton.setText(L.send); tg.MainButton.enable();
          }
        });
      return;
    }
    tg.sendData(JSON.stringify(booking));
  });
}
renderAll();
